name: Publish conference mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare Pages-only links and routing
        run: |
          sed -i 's|<BrowserRouter>|<BrowserRouter basename="/Corp_OS">|' src/main.tsx
          sed -i 's|href="/favicon.svg"|href="/Corp_OS/favicon.svg"|' index.html
      - run: npm run build -- --base=/Corp_OS/
      - name: Allow direct links to prototype screens
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
